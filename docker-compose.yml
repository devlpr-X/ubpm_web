services:
  db:
    image: postgres:16-alpine
    container_name: ubpm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ubpm
      POSTGRES_USER: ubpm
      POSTGRES_PASSWORD: ubpm
    volumes:
      - ubpm_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ubpm -d ubpm"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ubpm-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ubpm.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  ubpm_pgdata:
