{% extends "base.html" %}

{% block meta_robots %}noindex, nofollow{% endblock %}

{% block content %}
{# Цэс үргэлж дээр, хэвтээ мөрөөр (бүх дэлгэцэнд — хажуугийн самбар байхгүй). #}
<nav class="bg-white border border-gray-200 rounded-lg p-2 mb-6
            flex gap-1.5 overflow-x-auto text-sm">
  <a href="{% url 'dashboard:overview' %}"
     class="flex items-center gap-1.5 whitespace-nowrap px-3 py-2 rounded-lg hover:bg-gray-50 {% if request.resolver_match.url_name == 'overview' %}bg-brand-50 text-brand-700 font-medium{% endif %}">
    <i class="fa-regular fa-chart-bar fa-fw" aria-hidden="true"></i> <span>Тойм</span>
  </a>
  <a href="{% url 'dashboard:request_list' %}"
     class="flex items-center gap-1.5 whitespace-nowrap px-3 py-2 rounded-lg hover:bg-gray-50 {% if 'request' in request.resolver_match.url_name %}bg-brand-50 text-brand-700 font-medium{% endif %}">
    <i class="fa-regular fa-rectangle-list fa-fw" aria-hidden="true"></i> <span>Хүсэлтүүд</span>
  </a>
  <a href="{% url 'dashboard:delivery' %}"
     class="flex items-center gap-1.5 whitespace-nowrap px-3 py-2 rounded-lg hover:bg-gray-50 {% if request.resolver_match.url_name == 'delivery' %}bg-brand-50 text-brand-700 font-medium{% endif %}">
    <i class="fa-regular fa-map fa-fw" aria-hidden="true"></i> <span>Хүргэлт</span>
  </a>
  <a href="{% url 'dashboard:pickup_list' %}"
     class="flex items-center gap-1.5 whitespace-nowrap px-3 py-2 rounded-lg hover:bg-gray-50 {% if 'pickup' in request.resolver_match.url_name %}bg-brand-50 text-brand-700 font-medium{% endif %}">
    <i class="fa-solid fa-truck fa-fw" aria-hidden="true"></i> <span>Очиж авах</span>
  </a>
  <a href="{% url 'dashboard:reports' %}"
     class="flex items-center gap-1.5 whitespace-nowrap px-3 py-2 rounded-lg hover:bg-gray-50 {% if 'report' in request.resolver_match.url_name or request.resolver_match.url_name == 'export' %}bg-brand-50 text-brand-700 font-medium{% endif %}">
    <i class="fa-regular fa-file-lines fa-fw" aria-hidden="true"></i> <span>Тайлан</span>
  </a>
  <a href="/admin/"
     class="flex items-center gap-1.5 whitespace-nowrap px-3 py-2 rounded-lg hover:bg-gray-50 text-gray-500">
    <i class="fa-solid fa-gear fa-fw" aria-hidden="true"></i> <span>Удирдлага</span>
  </a>
</nav>

<main class="min-w-0">
  {% block dashboard_content %}{% endblock %}
</main>
{% endblock %}
