{% extends "dashboard/_layout.html" %}

{% block title %}Тайлан — UBPM{% endblock %}

{% block dashboard_content %}
<h1 class="text-2xl font-bold">Захиалгуудын тайлан</h1>
<p class="text-sm text-gray-600 mt-1">Шүүлтүүрээ сонгоод Excel, PDF, зураг (PNG) эсвэл CSV хэлбэрээр татаж аваарай. Бүх формат монгол хэл дэмжинэ.</p>

<form method="get" action="{% url 'dashboard:export' %}" class="mt-4 bg-white border rounded-lg p-4 space-y-3 max-w-xl">
  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="block text-xs text-gray-500 mb-1">Эхлэх огноо</label>
      <input type="date" name="date_from" class="w-full rounded border px-2 py-1.5 text-sm">
    </div>
    <div>
      <label class="block text-xs text-gray-500 mb-1">Дуусах огноо</label>
      <input type="date" name="date_to" class="w-full rounded border px-2 py-1.5 text-sm">
    </div>
  </div>

  <div>
    <label class="block text-xs text-gray-500 mb-1">Салбар</label>
    <select name="branch" class="w-full rounded border px-2 py-1.5 text-sm">
      <option value="">— Бүгд —</option>
      {% for b in branches %}
        <option value="{{ b.id }}">{{ b.name }}</option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label class="block text-xs text-gray-500 mb-1">Статус (олон сонгох боломжтой)</label>
    <select name="status" multiple size="5" class="w-full rounded border px-2 py-1.5 text-sm">
      {% for value, label in statuses %}
        <option value="{{ value }}">{{ label }}</option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label class="block text-xs text-gray-500 mb-1">Формат</label>
    <select name="format" class="w-full rounded border px-2 py-1.5 text-sm">
      <option value="xlsx">Excel (.xlsx)</option>
      <option value="pdf">PDF (.pdf)</option>
      <option value="png">Зураг (.png)</option>
      <option value="csv">CSV (.csv)</option>
    </select>
  </div>

  <div class="pt-2">
    <button class="bg-brand-500 hover:bg-brand-600 text-white px-4 py-2 rounded text-sm font-medium">⬇ Татах</button>
  </div>
</form>
{% endblock %}
